# 毎朝、EDINETに新しい有価証券報告書が出た会社だけを取り込み、ページを作り直して公開する
name: Update from EDINET

on:
  schedule:
    - cron: "0 21 * * *" # 毎朝6時（日本時間）
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: EDINETから取り込む（初回の取り込みは1回1,500社までに分ける）
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python3 tools/fetch_edinet.py --update --max 1500

      # 取り込みが途中で止まっても、取れた分は捨てずにページにしてコミットする
      - name: ページを作る
        if: ${{ !cancelled() }}
        run: python3 tools/make_status.py

      - name: 変わっていたらコミットする
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data pages
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "EDINETの新しい有価証券報告書を反映（自動）"
          # 実行中に手元から push されていても、取り込んだ結果を捨てないように取り込み直してから push する
          git pull -q --rebase -X theirs origin main
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN の push では pages.yml が動かないので、ここで公開する
  deploy:
    needs: update
    if: ${{ !cancelled() && needs.update.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - uses: actions/deploy-pages@v4
